<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>ใบเสร็จ | DELEF FEST GOPASS</title>

    <link rel="stylesheet" href="css/app.css">
</head>

<body class="page">

    <div class="queue-box narrow">

        <span class="kicker">RECEIPT</span>

        <h1>ใบเสร็จรับเงิน</h1>

        <div id="receipt"></div>

        <br>

        <a href="index.html" class="btn red">
            กลับหน้าแรก
        </a>

    </div>

    <script>

        const name = localStorage.getItem("customerName") || "-";
        const discordName = localStorage.getItem("customerDiscordName") || "-";
        const email = localStorage.getItem("customerEmail") || "-";

        const type = localStorage.getItem("ticketType") || "-";
        const qty = Number(localStorage.getItem("ticketQty") || 1);
        const price = Number(localStorage.getItem("ticketPrice") || 0);

        document.getElementById("receipt").innerHTML = `
            <div class="order-row">
                <span>ชื่อผู้จอง</span>
                <b>${name}</b>
            </div>

            <div class="order-row">
                <span>ชื่อDiscord</span>
                <b>${discordName}</b>
            </div>

            <div class="order-row">
                <span>อีเมล</span>
                <b>${email}</b>
            </div>

            <div class="order-row">
                <span>ประเภทบัตร</span>
                <b>${type}</b>
            </div>

            <div class="order-row">
                <span>จำนวนบัตร</span>
                <b>${qty} ใบ</b>
            </div>

            <div class="order-row">
                <span>ราคาต่อใบ</span>
                <b>${price.toLocaleString("th-TH")} บาท</b>
            </div>

            <div class="total">
                <span>ยอดรวม</span>
                <b>${(qty * price).toLocaleString("th-TH")} บาท</b>
            </div>
        `;

    </script>

</body>

</html>
